name: Web demo (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'web-demo/**'
      - 'mobile/src/**'
      - '.github/workflows/web-demo-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - run: npm ci
        working-directory: web-demo
      - run: npm test
        working-directory: web-demo
      - run: npm run build
        working-directory: web-demo
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APK_URL: https://github.com/${{ github.repository }}/releases/download/v1.3.14/atchacha-1.3.14-demo.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-demo/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
