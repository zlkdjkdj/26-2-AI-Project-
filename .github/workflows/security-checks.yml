name: Security and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pip install pip-audit
      - run: pip-audit -r backend/requirements.lock --no-deps --disable-pip
      - run: python scripts/check_publication.py
      - run: python -m pytest backend/tests/test_security.py backend/tests/test_analysis_service.py -q
      - run: npm ci
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
